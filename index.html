<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhà Thông Minh</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1d2430; --muted: #6b7684;
    --line: #e2e6eb; --accent: #2563eb; --on: #16a34a; --warn: #d97706; --off: #9aa3ad; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141a; --card: #18202a; --text: #e6ebf1; --muted: #8b96a3;
      --line: #263140; --accent: #60a5fa; --on: #22c55e; --warn: #f59e0b; --off: #5b6673; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 18px; margin: 0; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); }
  .dot.ok { background: var(--on); } .dot.err { background: var(--bad); } .dot.wait { background: var(--warn); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font-size: 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  h2 { font-size: 15px; margin: 22px 0 10px; color: var(--muted); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card .name { font-weight: 600; margin-bottom: 2px; }
  .card .type { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .big { font-size: 26px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); }
  .toggle { width: 52px; height: 30px; border-radius: 15px; border: none; background: var(--off); position: relative; padding: 0; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; transition: left .15s; }
  .toggle.on { background: var(--on); } .toggle.on::after { left: 25px; }
  .ctrl { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .badge { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
  .badge.alert { color: var(--bad); border-color: var(--bad); }
  .empty { color: var(--muted); font-size: 14px; }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; max-height: 180px; overflow: auto;
    white-space: pre-wrap; word-break: break-all; color: var(--muted); }
  .hidden { display: none; }
  select { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; }
  .chart { width: 100%; height: 160px; display: block; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .evt { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>🏠 Nhà Thông Minh</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">Chưa kết nối</span></div>
</header>
<main>
  <section id="connectPanel" class="panel">
    <div class="grid-form">
      <label>Broker host
        <input id="host" value="p1a15c0e.ala.asia-southeast1.emqxsl.com"></label>
      <label>Cổng WSS
        <input id="port" value="8084"></label>
      <label>Đường dẫn WebSocket
        <input id="path" value="/mqtt"></label>
      <label>Tiền tố topic
        <input id="prefix" value="home"></label>
      <label>Username
        <input id="username" value="webapp" autocomplete="username"></label>
      <label>Password
        <input id="password" type="password" autocomplete="current-password"></label>
      <label>Supabase URL (lịch sử, tuỳ chọn)
        <input id="sbUrl" value="https://trszrifpoenwcrkcfmfm.supabase.co"></label>
      <label>Supabase publishable / anon key
        <input id="sbKey" type="password" placeholder="sb_publishable_… hoặc eyJ…"></label>
    </div>
    <div class="row">
      <label style="flex-direction:row;align-items:center;gap:6px"><input id="remember" type="checkbox"> Nhớ mật khẩu trên máy này</label>
      <button id="connectBtn" class="primary">Kết nối</button>
    </div>
  </section>

  <div class="row" id="topBar" style="margin-top:0;margin-bottom:8px">
    <span id="gwStatus" class="sub"></span>
    <span style="flex:1"></span>
    <button id="editBtn" class="hidden">Đổi cấu hình</button>
    <button id="disconnectBtn" class="hidden">Ngắt kết nối</button>
  </div>

  <div id="rooms"><p class="empty">Kết nối tới broker để xem thiết bị.</p></div>

  <section id="historyPanel" class="panel hidden" style="margin-top:20px">
    <div class="row" style="margin-top:0;justify-content:space-between">
      <strong>Lịch sử</strong>
      <span>
        <select id="histRange">
          <option value="6">6 giờ</option>
          <option value="24" selected>24 giờ</option>
          <option value="168">7 ngày</option>
        </select>
        <button id="histReload">Tải lại</button>
      </span>
    </div>
    <div class="sub" id="histStatus" style="margin:8px 0"></div>
    <div id="histCharts"></div>
    <h2 style="margin-top:14px">Sự kiện gần đây</h2>
    <div id="histEvents" class="sub"></div>
  </section>

  <section class="panel" style="margin-top:20px">
    <div class="sub" style="margin-bottom:6px">Nhật ký MQTT</div>
    <div id="log"></div>
  </section>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const FIELDS = ["host", "port", "path", "prefix", "username", "sbUrl", "sbKey"];
  const STORE = "smarthome.cfg";
  let client = null;
  let prefix = "home";
  const devices = {};   // id -> { meta, state }
  const gateways = {};  // name -> "online" | "offline"

  // ---------- config persistence (browser only, best effort) ----------
  function loadCfg() {
    try {
      const cfg = JSON.parse(localStorage.getItem(STORE) || "{}");
      FIELDS.forEach((f) => { if (cfg[f]) $(f).value = cfg[f]; });
      if (cfg.password) { $("password").value = cfg.password; $("remember").checked = true; }
      return cfg;
    } catch (e) { return {}; }
  }
  function saveCfg() {
    const cfg = {};
    FIELDS.forEach((f) => (cfg[f] = $(f).value.trim()));
    if ($("remember").checked) cfg.password = $("password").value;
    try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {}
  }

  function log(msg) {
    const el = $("log");
    const t = new Date().toLocaleTimeString("vi-VN");
    el.textContent = `[${t}] ${msg}\n` + el.textContent.slice(0, 8000);
  }
  function setStatus(kind, text) {
    $("dot").className = "dot " + kind;
    $("statusText").textContent = text;
  }

  // ---------- MQTT ----------
  function connect() {
    const host = $("host").value.trim();
    if (!host) { alert("Nhập broker host trước đã."); return; }
    saveCfg();
    prefix = $("prefix").value.trim().replace(/^\/+|\/+$/g, "") || "home";
    if (client) client.end(true);
    for (const k in devices) delete devices[k];
    for (const k in gateways) delete gateways[k];
    render();

    const url = `wss://${host}:${$("port").value.trim() || 8084}${$("path").value.trim() || "/mqtt"}`;
    setStatus("wait", "Đang kết nối…");
    log("Kết nối " + url);
    client = mqtt.connect(url, {
      username: $("username").value.trim() || undefined,
      password: $("password").value || undefined,
      clientId: "web-" + Math.random().toString(16).slice(2, 10),
      reconnectPeriod: 3000,
      connectTimeout: 10000,
      clean: true,
    });

    client.on("connect", () => {
      setStatus("ok", "Đã kết nối");
      log("Đã kết nối, subscribe " + prefix + "/#");
      client.subscribe(prefix + "/#", { qos: 1 });
      $("connectPanel").classList.add("hidden");
      $("editBtn").classList.remove("hidden");
      $("disconnectBtn").classList.remove("hidden");
      setTimeout(loadHistory, 1500); // đợi retained meta về để biết thiết bị nào là cảm biến
    });
    let authFailed = false;
    client.on("reconnect", () => setStatus("wait", "Đang kết nối lại…"));
    client.on("close", () => { if (!authFailed) setStatus("err", "Mất kết nối"); });
    client.on("error", (err) => {
      log("Lỗi: " + err.message);
      // CONNACK 4/5 (MQTT 3.1.1) hoặc 134/135 (MQTT 5): sai tài khoản / không có quyền -> thử lại vô ích
      if ([4, 5, 134, 135].includes(err.code) || /username or password|not authorized/i.test(err.message)) {
        authFailed = true;
        client.end(true);
        setStatus("err", "Sai username hoặc mật khẩu");
        $("connectPanel").classList.remove("hidden");
        $("password").focus();
        return;
      }
      setStatus("err", "Lỗi: " + err.message);
    });
    client.on("message", onMessage);
  }

  function onMessage(topic, payload) {
    const text = payload.toString();
    if (!topic.startsWith(prefix + "/")) return;
    const parts = topic.slice(prefix.length + 1).split("/");
    // prefix/_status/<gateway>
    if (parts.length === 2 && parts[0] === "_status") {
      gateways[parts[1]] = text;
      renderGateways();
      log(`${topic} = ${text}`);
      return;
    }
    // prefix/<deviceId>/(meta|state)
    if (parts.length !== 2) return;
    const [id, kind] = parts;
    if (kind !== "meta" && kind !== "state") return;
    if (!text) { delete devices[id]; render(); return; } // empty retained = removed
    let data;
    try { data = JSON.parse(text); } catch (e) { log("JSON lỗi trên " + topic); return; }
    devices[id] = devices[id] || { meta: null, state: {} };
    devices[id][kind] = data;
    if (kind === "state") log(`${id} → ${text}`);
    render();
  }

  function send(id, cmd) {
    if (!client || !client.connected) { alert("Chưa kết nối broker."); return; }
    const topic = `${prefix}/${id}/set`;
    client.publish(topic, JSON.stringify(cmd), { qos: 1 });
    log(`Gửi ${topic} ${JSON.stringify(cmd)}`);
  }

  // ---------- rendering ----------
  const TYPE_LABEL = { light: "Đèn", plug: "Ổ cắm", ac: "Điều hoà", sensor: "Cảm biến", door: "Cửa" };

  function renderGateways() {
    const names = Object.keys(gateways);
    $("gwStatus").textContent = names.length
      ? "Gateway: " + names.map((n) => `${n} (${gateways[n] === "online" ? "🟢 online" : "🔴 offline"})`).join(", ")
      : "";
  }

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "onclick") e.onclick = attrs[k]; else e.setAttribute(k, attrs[k]);
    }
    kids.forEach((k) => e.append(k));
    return e;
  }

  function cardFor(id, dev) {
    const m = dev.meta, s = dev.state || {};
    const card = el("div", { class: "card" },
      el("div", { class: "name" }, m.name || id),
      el("div", { class: "type" }, TYPE_LABEL[m.type] || m.type || ""));

    if (m.type === "light" || m.type === "plug") {
      const t = el("button", { class: "toggle" + (s.on ? " on" : ""), "aria-label": "Bật/tắt",
        onclick: () => send(id, { on: !s.on }) });
      card.append(el("div", { class: "ctrl" }, el("span", { class: "big" }, s.on ? "Bật" : "Tắt"), t));
      if (typeof s.power === "number") card.append(el("div", { class: "sub" }, `Công suất: ${s.power} W`));
    } else if (m.type === "ac") {
      const t = el("button", { class: "toggle" + (s.on ? " on" : ""), "aria-label": "Bật/tắt",
        onclick: () => send(id, { on: !s.on }) });
      card.append(el("div", { class: "ctrl" }, el("span", { class: "big" }, s.on ? `${s.target ?? "--"}°C` : "Tắt"), t));
      const target = s.target ?? 25;
      card.append(el("div", { class: "ctrl" },
        el("button", { onclick: () => send(id, { target: Math.max(16, target - 1) }) }, "−"),
        el("span", { class: "sub" }, "Nhiệt độ đặt"),
        el("button", { onclick: () => send(id, { target: Math.min(30, target + 1) }) }, "+")));
    } else if (m.type === "sensor") {
      card.append(el("div", { class: "big" }, s.temp != null ? `${s.temp.toFixed(1)}°C` : "--"));
      card.append(el("div", { class: "sub" }, s.hum != null ? `Độ ẩm ${Math.round(s.hum)}%` : ""));
    } else if (m.type === "door") {
      card.append(el("span", { class: "badge" + (s.open ? " alert" : "") }, s.open ? "🚪 Đang mở" : "🔒 Đã đóng"));
    } else {
      card.append(el("div", { class: "sub" }, JSON.stringify(s)));
    }
    return card;
  }

  function render() {
    const root = $("rooms");
    root.innerHTML = "";
    const ids = Object.keys(devices).filter((id) => devices[id].meta);
    if (!ids.length) {
      root.append(el("p", { class: "empty" }, client && client.connected
        ? "Đã kết nối nhưng chưa có thiết bị nào gửi meta lên. Hãy chạy simulator hoặc bật ESP32."
        : "Kết nối tới broker để xem thiết bị."));
      return;
    }
    const byRoom = {};
    ids.forEach((id) => {
      const room = devices[id].meta.room || "Khác";
      (byRoom[room] = byRoom[room] || []).push(id);
    });
    Object.keys(byRoom).sort().forEach((room) => {
      root.append(el("h2", {}, room));
      const grid = el("div", { class: "cards" });
      byRoom[room].sort().forEach((id) => grid.append(cardFor(id, devices[id])));
      root.append(grid);
    });
  }

  // ---------- history (Supabase REST) ----------
  async function sb(path, opts) {
    const base = $("sbUrl").value.trim().replace(/\/+$/, "");
    const res = await fetch(base + path, {
      ...opts,
      headers: { apikey: $("sbKey").value.trim(), "Content-Type": "application/json" },
    });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    return res.json();
  }

  function nameOf(id) { return (devices[id] && devices[id].meta && devices[id].meta.name) || id; }

  function lineChart(points, key, color, unit) {
    const vals = points.map((p) => p[key]).filter((v) => v != null).map(Number);
    if (vals.length < 2) return el("div", { class: "sub" }, "Chưa đủ dữ liệu để vẽ.");
    const W = 600, H = 160, L = 34, R = 8, T = 8, B = 20;
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max - min < 1) { min -= 0.5; max += 0.5; }
    const t0 = new Date(points[0].bucket).getTime(), t1 = new Date(points[points.length - 1].bucket).getTime();
    const x = (t) => L + ((t - t0) / Math.max(1, t1 - t0)) * (W - L - R);
    const y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);
    const d = points.filter((p) => p[key] != null)
      .map((p, i) => `${i ? "L" : "M"}${x(new Date(p.bucket).getTime()).toFixed(1)},${y(Number(p[key])).toFixed(1)}`).join("");
    const fmt = (t) => new Date(t).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" });
    const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${key}">
      <line class="grid" x1="${L}" x2="${W - R}" y1="${y(max)}" y2="${y(max)}"/>
      <line class="grid" x1="${L}" x2="${W - R}" y1="${y(min)}" y2="${y(min)}"/>
      <text x="2" y="${y(max) + 4}">${max.toFixed(1)}</text>
      <text x="2" y="${y(min) + 4}">${min.toFixed(1)}</text>
      <text x="${L}" y="${H - 4}">${fmt(t0)}</text>
      <text x="${W - R}" y="${H - 4}" text-anchor="end">${fmt(t1)}</text>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>`;
    const wrap = el("div");
    wrap.innerHTML = svg;
    return wrap;
  }

  function describe(id, p) {
    if ("open" in p) return p.open ? "🚪 mở" : "🔒 đóng";
    if ("on" in p) return (p.on ? "bật" : "tắt") + (p.target != null ? ` (${p.target}°C)` : "");
    return JSON.stringify(p);
  }

  async function loadHistory() {
    if (!$("sbUrl").value.trim() || !$("sbKey").value.trim()) { $("historyPanel").classList.add("hidden"); return; }
    $("historyPanel").classList.remove("hidden");
    const hours = Number($("histRange").value);
    $("histStatus").textContent = "Đang tải…";
    const charts = $("histCharts"), list = $("histEvents");
    try {
      const sensors = Object.keys(devices).filter((id) => devices[id].meta && devices[id].meta.type === "sensor");
      if (!sensors.length) sensors.push("living_temp");
      charts.innerHTML = "";
      for (const id of sensors) {
        const pts = await sb("/rest/v1/rpc/sensor_history", { method: "POST", body: JSON.stringify({ p_device: id, p_hours: hours }) });
        charts.append(el("div", { class: "sub", style: "margin-top:6px;font-weight:600" }, nameOf(id)));
        charts.append(el("div", { class: "legend" }, el("span", {}, el("i", { style: "background:var(--warn)" }), "Nhiệt độ (°C)")));
        charts.append(lineChart(pts, "temp", "var(--warn)"));
        charts.append(el("div", { class: "legend" }, el("span", {}, el("i", { style: "background:var(--accent)" }), "Độ ẩm (%)")));
        charts.append(lineChart(pts, "hum", "var(--accent)"));
      }
      // Sự kiện: bỏ dữ liệu cảm biến, chỉ giữ lần trạng thái thực sự đổi
      const since = new Date(Date.now() - hours * 3600e3).toISOString();
      const rows = await sb(`/rest/v1/events?select=created_at,device,payload&payload->>temp=is.null&created_at=gte.${since}&order=created_at.asc&limit=1000`);
      const last = {}, changes = [];
      rows.forEach((r) => {
        const key = JSON.stringify({ on: r.payload.on, open: r.payload.open, target: r.payload.target });
        if (last[r.device] !== key) { if (last[r.device] !== undefined) changes.push(r); last[r.device] = key; }
      });
      list.innerHTML = "";
      changes.reverse().slice(0, 30).forEach((r) => list.append(el("div", { class: "evt" },
        el("span", {}, `${nameOf(r.device)}: ${describe(r.device, r.payload)}`),
        el("span", {}, new Date(r.created_at).toLocaleString("vi-VN")))));
      if (!changes.length) list.textContent = "Chưa có thay đổi trạng thái nào trong khoảng này.";
      $("histStatus").textContent = `Cập nhật lúc ${new Date().toLocaleTimeString("vi-VN")}`;
    } catch (e) {
      $("histStatus").textContent = "Lỗi tải lịch sử: " + e.message;
    }
  }
  $("histReload").onclick = loadHistory;
  $("histRange").onchange = loadHistory;

  // ---------- wiring ----------
  $("connectBtn").onclick = connect;
  $("editBtn").onclick = () => $("connectPanel").classList.toggle("hidden");
  $("disconnectBtn").onclick = () => {
    if (client) client.end(true);
    client = null;
    setStatus("", "Chưa kết nối");
    $("connectPanel").classList.remove("hidden");
    render();
  };

  const cfg = loadCfg();
  if (cfg.host && cfg.password) connect();
})();
</script>
</body>
</html>
